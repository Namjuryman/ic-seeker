services:
  postgres:
    image: postgres:16-alpine
    container_name: siliconscope-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-siliconscope}
      POSTGRES_USER: ${POSTGRES_USER:-siliconscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siliconscope_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - siliconscope_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-siliconscope} -d ${POSTGRES_DB:-siliconscope}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: siliconscope-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - siliconscope_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: siliconscope-meilisearch
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-siliconscope_dev_master_key}
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - siliconscope_meili:/meili_data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: siliconscope-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-siliconscope}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-siliconscope_dev_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - siliconscope_minio:/data

  mailpit:
    image: axllent/mailpit:v1.24
    container_name: siliconscope-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  siliconscope_postgres:
  siliconscope_redis:
  siliconscope_meili:
  siliconscope_minio:
