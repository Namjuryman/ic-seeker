<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3452b8"/>
      <stop offset="100%" stop-color="#253f98"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#eef3ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Inner chip square -->
  <rect x="28" y="28" width="44" height="44" rx="6" fill="url(#chipGrad)"/>
  
  <!-- Circuit lines on chip -->
  <line x1="35" y1="42" x2="65" y2="42" stroke="#3452b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="35" y1="50" x2="55" y2="50" stroke="#3452b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="35" y1="58" x2="60" y2="58" stroke="#3452b8" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Small dots/circuits -->
  <circle cx="42" cy="42" r="3" fill="#3452b8"/>
  <circle cx="52" cy="50" r="3" fill="#3452b8"/>
  <circle cx="62" cy="58" r="3" fill="#3452b8"/>
  
  <!-- Pin legs on left -->
  <line x1="15" y1="35" x2="28" y2="35" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="15" y1="50" x2="28" y2="50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="15" y1="65" x2="28" y2="65" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Pin legs on right -->
  <line x1="72" y1="35" x2="85" y2="35" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="72" y1="50" x2="85" y2="50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="72" y1="65" x2="85" y2="65" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Pin legs on top -->
  <line x1="35" y1="15" x2="35" y2="28" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="15" x2="50" y2="28" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="65" y1="15" x2="65" y2="28" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Pin legs on bottom -->
  <line x1="35" y1="72" x2="35" y2="85" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="72" x2="50" y2="85" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="65" y1="72" x2="65" y2="85" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
</svg>