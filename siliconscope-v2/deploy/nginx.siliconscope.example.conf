# SiliconScope independent-domain Nginx template.
# Put this into /etc/nginx/sites-available/siliconscope and symlink it to sites-enabled.

server {
    listen 80;
    server_name siliconscope.com www.siliconscope.com admin.siliconscope.com api.siliconscope.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name siliconscope.com www.siliconscope.com;

    root /srv/siliconscope/frontend/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.siliconscope.com;

    root /srv/siliconscope/frontend-admin/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Production recommendation:
    # put this hostname behind Cloudflare Access, VPN, or Nginx auth_request.
}

server {
    listen 443 ssl http2;
    server_name api.siliconscope.com;

    client_max_body_size 32m;

    location / {
        # Host-level backend default. If you run Docker Compose, use the Docker Caddy template instead.
        proxy_pass http://127.0.0.1:8751;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
