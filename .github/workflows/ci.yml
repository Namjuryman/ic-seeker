name: SiliconScope v2 CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: siliconscope-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: siliconscope-v2

jobs:
  database-fixture:
    name: Build SQLite fixture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: siliconscope-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build fixture SQLite database from CSV
        run: npm run db:build-from-csv -- --out=${{ runner.temp }}/siliconscope-ci.sqlite --limit=1000 --force

      - name: Upload SQLite fixture
        uses: actions/upload-artifact@v4
        with:
          name: siliconscope-ci-sqlite
          path: ${{ runner.temp }}/siliconscope-ci.sqlite
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    needs: database-fixture
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: siliconscope-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download SQLite fixture
        uses: actions/download-artifact@v4
        with:
          name: siliconscope-ci-sqlite
          path: ${{ runner.temp }}

      - name: Backend build
        env:
          DATABASE_URL: ${{ runner.temp }}/siliconscope-ci.sqlite
        run: npm run build:backend

      - name: Backend tests
        env:
          DATABASE_URL: ${{ runner.temp }}/siliconscope-ci.sqlite
        run: npm test -- --run

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: database-fixture
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: siliconscope-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

  admin:
    name: Admin build
    runs-on: ubuntu-latest
    needs: database-fixture
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: siliconscope-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build admin
        run: npm run build:admin
