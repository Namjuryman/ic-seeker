name: SiliconScope v2 CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: siliconscope-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: siliconscope-v2

jobs:
  database-fixture:
    name: Build SQLite fixture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: siliconscope-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build fixture SQLite database from CSV
        run: |
          npm run db:build-from-csv -- \
            --csv=src/__fixtures__/ic_chipseeker.sample.csv \
            --out=${{ runner.temp }}/siliconscope-ci.sqlite \
            --force
          cd backend
          node -e "const Database=require('better-sqlite3'); const db=new Database('${{ runner.temp }}/siliconscope-ci.sqlite'); const count=db.prepare('SELECT COUNT(*) AS n FROM papers').get().n; const hits=db.prepare(\"SELECT COUNT(*) AS n FROM papers_fts WHERE papers_fts MATCH 'buck OR pmic'\").get().n; if (count !== 1000) throw new Error('Expected 1000 papers, got '+count); if (hits < 1) throw new Error('Expected buck/pmic FTS hits'); db.close();"

      - name: Upload SQLite fixture
        uses: actions/upload-artifact@v4
        with:
          name: siliconscope-ci-sqlite
          path: ${{ runner.temp }}/siliconscope-ci.sqlite
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    needs: database-fixture
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: siliconscope-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download SQLite fixture
        uses: actions/download-artifact@v4
        with:
          name: siliconscope-ci-sqlite
          path: ${{ runner.temp }}

      - name: Check environment example coverage
        run: npm run env:check

      - name: Backend build
        env:
          DATABASE_URL: ${{ runner.temp }}/siliconscope-ci.sqlite
        run: npm run build:backend

      - name: Backend tests
        env:
          DATABASE_URL: ${{ runner.temp }}/siliconscope-ci.sqlite
        run: npm test -- --run

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: database-fixture
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: siliconscope-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

  admin:
    name: Admin build
    runs-on: ubuntu-latest
    needs: database-fixture
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: siliconscope-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build admin
        run: npm run build:admin
