<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IC Seeker</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <section class="login-screen" id="loginScreen" hidden>
      <form class="login-card" id="loginForm">
        <div class="brand">
          <div class="mark">IC</div>
          <div>
            <h1 id="loginTitle">IC Seeker Private</h1>
            <p>Private paper search and reading workspace</p>
          </div>
        </div>
        <label class="field">
          <span>Password</span>
          <input id="password" type="password" autocomplete="current-password" placeholder="ADMIN_PASSWORD">
        </label>
        <button class="button primary" type="submit">Log in</button>
        <p class="error" id="loginError"></p>
      </form>
    </section>

    <div class="app" id="appShell" hidden>
      <header class="app-header">
        <div class="brand">
          <div class="mark">IC</div>
          <div>
            <h1 id="appTitle">IC Seeker</h1>
            <p>Private IC scholar intelligence</p>
          </div>
        </div>

        <div class="searchbox">
          <span aria-hidden="true">&#128269;</span>
          <input id="q" placeholder="Search papers, circuits, authors, DOI...">
        </div>
        <button class="button primary search-action" id="searchNow" type="button">Search</button>
        <label class="toggle">
          <input id="semantic" type="checkbox" checked>
          <span>Semantic</span>
        </label>
        <select id="sort" class="sort">
          <option value="relevance">Relevance</option>
          <option value="score">Score</option>
          <option value="year">Year</option>
          <option value="citations">Citations</option>
          <option value="title">Title</option>
        </select>
        <button class="button ghost logout-button" id="logout" type="button">Log out</button>
      </header>

      <section class="quickbar">
        <div class="topic-chips" id="topicChips"></div>
        <div class="view-switch" aria-label="Result view">
          <button class="icon-button active" id="viewComfort" type="button" title="Comfort view">Rows</button>
          <button class="icon-button" id="viewCompact" type="button" title="Compact view">Table</button>
        </div>
      </section>

      <div class="app-layout">
      <aside class="sidebar">
        <div class="panel-title">
          <strong>Filters</strong>
          <button class="text-link" id="resetFilters" type="button">Reset</button>
        </div>

        <label class="field">
          <span>Venue</span>
          <select id="venue"></select>
        </label>
        <label class="field">
          <span>Domain</span>
          <select id="field"></select>
        </label>
        <label class="field">
          <span>Rank</span>
          <select id="rank"></select>
        </label>
        <div class="year-grid">
          <label class="field">
            <span>From</span>
            <input id="yearFrom" inputmode="numeric" value="2016">
          </label>
          <label class="field">
            <span>To</span>
            <input id="yearTo" inputmode="numeric" value="2026">
          </label>
        </div>
        <label class="check">
          <input id="hasPdf" type="checkbox">
          <span>Has local PDF</span>
        </label>
        <label class="check">
          <input id="favoriteOnly" type="checkbox">
          <span>Favorites only</span>
        </label>
        <label class="field">
          <span>Status</span>
          <select id="statusFilter">
            <option value="">All</option>
            <option value="unread">Unread</option>
            <option value="reading">Reading</option>
            <option value="read">Read</option>
            <option value="important">Important</option>
            <option value="skip">Skip</option>
          </select>
        </label>
        <label class="field">
          <span>Tag</span>
          <select id="tagFilter"></select>
        </label>

        <div class="stats" id="stats"></div>
        <details class="side-panel import-panel">
          <summary>Paper import</summary>
          <div class="inline-form">
            <input id="doiInput" placeholder="DOI">
            <button class="button" id="importDoi" type="button">Import</button>
          </div>
          <details class="nested-details">
            <summary>Manual metadata</summary>
            <input id="manualTitle" placeholder="Title">
            <input id="manualAuthors" placeholder="Authors separated by ;">
            <input id="manualVenue" placeholder="Venue">
            <input id="manualYear" placeholder="Year">
            <textarea id="manualAbstract" placeholder="Abstract"></textarea>
            <button class="button" id="importManual" type="button">Add paper</button>
          </details>
          <p class="hint" id="importStatus"></p>
        </details>
        <details class="side-panel admin-panel">
          <summary>API keys</summary>
          <div id="apiKeys"></div>
          <div class="inline-form">
            <select id="apiProvider">
              <option value="openai">OpenAI</option>
              <option value="ieee">IEEE</option>
              <option value="crossref">Crossref</option>
            </select>
            <input id="apiValue" type="password" placeholder="Paste key">
          </div>
          <button class="button" id="saveApiKey" type="button">Save key</button>
        </details>
        <details class="side-panel">
          <summary>Local PDF inbox</summary>
          <div id="pdfInbox"></div>
        </details>
        <div class="side-panel" id="coverage"></div>
        <a class="download" href="/download/csv">Download CSV</a>
      </aside>

      <main class="main">
        <section class="summary" id="summary"></section>
        <div class="results" id="results"></div>
      </main>

      <aside class="right-rail">
        <article class="detail" id="detail">
          <div class="empty">Select a paper to inspect abstract, DOI, score, PDF status, notes, and tags.</div>
        </article>
        <section class="inspector">
          <div class="method" id="methodology"></div>
          <div class="leaderboard" id="professors"></div>
          <div class="leaderboard" id="institutions"></div>
        </section>
      </aside>
      </div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
